[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blueprint"
version = "0.1.0"
description = "A compact, framework-independent Plan-Act-Observe-Reflect agent reference implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
agent-blueprint = "agent_blueprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

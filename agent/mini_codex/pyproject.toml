[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-codex-local"
version = "0.1.0"
description = "A readable local coding agent with tools, approvals and resumable sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mini-codex = "mini_codex.cli:main"

[tool.setuptools.packages.find]
include = ["mini_codex*"]
